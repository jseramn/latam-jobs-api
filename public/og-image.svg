<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top: kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="44" rx="22" fill="#ebf5ff"/>
    <circle cx="22" cy="22" r="4" fill="#0068d6"/>
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#0068d6">Validando demanda · 30 signups = GO</text>
  </g>

  <!-- Hero: logo + product name -->
  <g transform="translate(80, 160)">
    <rect width="56" height="56" rx="8" fill="#171717"/>
    <text x="28" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">L</text>

    <text x="76" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#171717" letter-spacing="-1.2">latam-jobs</text>
    <text x="76" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#666" dx="160" letter-spacing="-1.2">.api</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80, 280)">
    <text font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="68" font-weight="600" fill="#171717" letter-spacing="-2.4">
      <tspan x="0" dy="0">Una API.</tspan>
      <tspan x="0" dy="84">Todas las bolsas</tspan>
      <tspan x="0" dy="84">de LATAM.</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 568)">
    <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4d4d4d">
      <tspan x="0">Computrabajo · Bumeran · OCC · ZonaJobs · Laborum.</tspan>
      <tspan x="0" dy="30">Salario parseado. Deduplicado. $49/mes.</tspan>
    </text>
  </g>

  <!-- Workflow dots (decorative) -->
  <g transform="translate(960, 380)">
    <rect width="180" height="180" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <text x="90" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#666" letter-spacing="1">GET /v1/search</text>
    <text x="20" y="80" font-family="ui-monospace, monospace" font-size="13" fill="#171717">?q=python</text>
    <text x="20" y="100" font-family="ui-monospace, monospace" font-size="13" fill="#666">&amp;country=mx,co,ar</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <text x="20" y="148" font-family="ui-monospace, monospace" font-size="11" fill="#666">{</text>
    <text x="30" y="166" font-family="ui-monospace, monospace" font-size="11" fill="#171717">  "results": [...]</text>
  </g>
</svg>
