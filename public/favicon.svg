<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Borde cuadrado grueso para que sobreviva render a 16px -->
  <rect x="1" y="1" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1"/>
  <!-- Silueta LATAM: solo los puntos que forman el contorno reconocible -->
  <!-- Brasil (curva derecha), Colombia (centro), México (arriba-izq), Argentina (abajo-izq) -->
  <g fill="#ffffff">
    <!-- México -->
    <rect x="3" y="3" width="1.5" height="1.5"/>
    <!-- Colombia -->
    <rect x="6.5" y="6" width="1.5" height="1.5"/>
    <!-- Brasil (más grande, acento) -->
    <rect x="10" y="7.5" width="2" height="2"/>
    <!-- Argentina -->
    <rect x="7" y="10.5" width="1.5" height="1.5"/>
  </g>
  <!-- Hub central vacío para que la silueta lea como LATAM -->
  <rect x="8" y="8" width="0.5" height="0.5" fill="#000000"/>
</svg>
