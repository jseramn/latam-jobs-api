<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="2" y="2" width="44" height="44" fill="none" stroke="#ffffff" stroke-width="1"/>
  <g fill="#ffffff">
    <!-- Silueta LATAM minimalista -->
    <rect x="10" y="10" width="2.5" height="2.5"/>  <!-- México -->
    <rect x="20" y="18" width="2.5" height="2.5"/>  <!-- Colombia -->
    <rect x="30" y="22" width="3" height="3"/>      <!-- Brasil (acento, más grande) -->
    <rect x="22" y="30" width="2.5" height="2.5"/>  <!-- Argentina -->
    <rect x="14" y="32" width="2" height="2"/>      <!-- Chile -->
  </g>
  <!-- Hub central vacío para conectar visualmente -->
  <rect x="23" y="23" width="2" height="2" fill="#000000"/>
</svg>
